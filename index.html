<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Table Tennis Gear Database</title>
    <link rel="stylesheet" href="./styles.css?v=ratings-25">
  </head>
  <body>
    <main class="app-shell">
      <section class="hero">
        <div>
          <p class="eyebrow">Table Tennis Gear Database</p>
          <h1>乒乓器材数据库</h1>
        </div>
        <div class="hero-tools">
          <button id="langToggle" class="lang-toggle" type="button" aria-label="Switch language">EN</button>
          <div class="search-wrap">
            <input id="searchInput" type="search" placeholder="搜索品牌、型号、系列..." autocomplete="off">
          </div>
        </div>
      </section>

      <nav class="tabs" aria-label="器材类型">
        <button class="tab is-active" data-type="rubbers" type="button">套胶</button>
        <button class="tab" data-type="blades" type="button">底板</button>
        <button class="tab" data-type="boosters" type="button">膨胀油</button>
      </nav>

      <section id="listView">
        <section class="filter-board" aria-label="筛选条件">
          <div class="filter-topline">
            <div>
              <h2 id="filterTitle">套胶筛选</h2>
              <p id="filterHint">同一项目可多选，不同项目会叠加筛选。</p>
            </div>
            <button id="clearFilters" class="ghost-button" type="button">清空筛选</button>
          </div>
          <div id="filterGroups" class="filter-groups"></div>
        </section>

        <section class="results-head">
          <div>
            <p class="result-count"><span id="resultCount">0</span><span id="resultSuffix"> 个结果</span></p>
            <div id="activeFilters" class="active-filters"></div>
          </div>
          <label class="sort-box">
            <span>排序</span>
            <select id="sortSelect">
              <option value="default">默认</option>
              <option value="price-asc">价格从低到高</option>
              <option value="price-desc">价格从高到低</option>
              <option value="name">名称</option>
            </select>
          </label>
        </section>

        <section id="productGrid" class="product-grid" aria-live="polite"></section>
      </section>

      <section id="detailView" class="detail-view is-hidden" aria-live="polite"></section>
    </main>

    <script src="./config.js?v=ratings-25"></script>
    <script src="./app.js?v=ratings-25"></script>
  </body>
</html>
